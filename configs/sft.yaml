# G-STAR SFT (python train.py -c configs/sft.yaml --model <pretrain checkpoint> --visual-tokenizer ... --output ...)
# Keys are train.py's argument names; command-line flags override them. Relative paths of data, roles and
# deepspeed are resolved against the repository root.

# dataset
stage: sft
data: configs/data/sft.json5
roles: configs/roles.json
max_length: 8192
packing: true
seed: 42

# optimizer
lr: 1.0e-5
head_lr_scale: 1.0
opt_betas: [0.9, 0.95]
weight_decay: 0.05

# schedule
sched: cosine
warmup_steps: 100
max_steps: 10000

# training
batch_size: 1
grad_accum_steps: 1
bf16: true
grad_checkpointing: true
deepspeed: configs/deepspeed.json

# logging, checkpoints
output: outputs/sft
log_interval: 10
log_to: tensorboard
checkpoint_interval: 1000
checkpoint_hist: 3
save_safetensors: false
